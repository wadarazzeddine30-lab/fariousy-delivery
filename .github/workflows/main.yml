name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Web
        run: |
          npm install --legacy-peer-deps
          npm install react-is --legacy-peer-deps
          npx vite build
      - name: Setup Capacitor & Android
        run: |
          rm -rf android capacitor.config.*
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          echo '{"appId":"com.fariousy.delivery","appName":"Fariousy Delivery","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fariousy-delivery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
